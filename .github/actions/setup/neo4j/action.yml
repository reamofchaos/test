name: "neo4j"
description: "setup neo4j community edition 5.x"

runs:
  using: "composite"
  steps:
    # Linux 环境配置
    - if: runner.os == 'Linux'
      name: Add Neo4j APT repository
      shell: bash
      run: |
        wget -O - https://debian.neo4j.com/neotechnology.gpg.key | sudo apt-key add -
        echo 'deb https://debian.neo4j.com stable 5.x' | sudo tee /etc/apt/sources.list.d/neo4j.list
        sudo apt-get update -q

    # 安装步骤
    - name: Install Neo4j
      uses: ./.github/actions/setup/package
      with:
        brew: neo4j@5
        apt: neo4j

    # macOS 路径配置
    - if: runner.os == 'macOS'
      name: Add Neo4j to PATH
      shell: bash
      run: echo "/opt/homebrew/opt/neo4j@5/bin" >> $GITHUB_PATH

    - if: runner.os == 'Windows'
      name: Manual Install Neo4j
      shell: powershell
      run: |
#        $downloadUrl = "https://neo4j.com/artifact.php?name=neo4j-community-5.15.0-windows.zip"
        $downloadUrl = "https://neo4j.com/artifact.php?name=neo4j-community-5.26.5-windows.zip"
        $installPath = "C:\neo4j"

        # 下载并解压
        Invoke-WebRequest $downloadUrl -OutFile "$env:TEMP\neo4j.zip"
        Expand-Archive -Path "$env:TEMP\neo4j.zip" -DestinationPath $installPath -Force

        # 设置环境变量
        $neo4jBin = (Get-ChildItem "$installPath\neo4j-community-5*\bin").FullName
        echo "NEO4J_HOME=$((Get-Item $neo4jBin).Directory.Parent.FullName)" >> $env:GITHUB_ENV
        echo "$neo4jBin" >> $env:GITHUB_PATH

